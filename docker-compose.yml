services:
  lmstudio:
    image: ghcr.io/CHANGE-ME/lmstudio-container:latest
    container_name: lmstudio
    restart: unless-stopped
    ports:
      - "1234:1234"
    volumes:
      # Single persistent volume for models, config, and conversations.
      # Replace ./data with a host path on a fast disk (NVMe ideally).
      - ./data:/data
    environment:
      # Match these to the UID/GID that owns ./data on the host.
      # On TrueNAS SCALE the default "apps" user is 568:568.
      PUID: "568"
      PGID: "568"
      LMS_PORT: "1234"
      # Optional: download one or more models on first boot (space-separated).
      # LMS_PREFETCH: "qwen/qwen3-4b"
      # Optional: keep a specific model resident in memory at startup.
      # LMS_LOAD: "qwen/qwen3-4b"

    # Uncomment the deploy block below if you have an NVIDIA GPU and the
    # NVIDIA Container Toolkit installed on the host.
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]
